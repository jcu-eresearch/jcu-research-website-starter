title: "Research project website starter"
description: "A JCU-themed static website for research project communications."
url: "https://jcu-eresearch.github.io"
baseurl: "/jcu-research-website-starter"

remote_theme: jcu-eresearch/jcu-research-website-theme

plugins:
  - jekyll-remote-theme

markdown: kramdown
kramdown:
  input: GFM

defaults:
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "page"

# Optional theme overrides.
# Leave these commented to use the theme defaults. Uncomment only the settings you want to change.
#
theme_settings:
#   show_breadcrumbs: true
  logo: "/assets/images/jcu-logo-mono.svg"
#   favicon: "/assets/images/favicon.svg"
  logo_alt: "James Cook University"
  project_logo: "/assets/sample-images/project-logo.svg"
  project_logo_alt: "Overlapping R and W project logo"
  sidebar_logo_tile_background: "transparent"
  sidebar_logo_tile_border_color: "transparent"
  sidebar_project_logo_tile_background: "transparent"
  sidebar_project_logo_tile_border_color: "transparent"
#   font_family: "Lato, Arial, Helvetica, sans-serif"
#   heading_font_family: "Lora, Georgia, serif"
#   primary_color: "#354F52"
#   secondary_color: "#C3D5C7"
